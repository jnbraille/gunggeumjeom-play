<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숫자 연습 - 궁금점 PLAY</title><style>body{font-family:Arial,"Malgun Gothic",sans-serif;font-size:19px;line-height:1.6;max-width:720px;margin:0 auto;padding:16px;color:#111;background:#fff}a,button,input{font-size:inherit}nav a,.back,button{display:block;padding:12px;margin:9px 0;border:2px solid #333;color:#111;background:#fff;text-decoration:none}input{padding:12px;max-width:90%;border:2px solid #333}a:focus,button:focus,input:focus{outline:3px solid #0060aa}#feedback{font-weight:bold}#dots{font-size:28px;white-space:pre-wrap;overflow-wrap:anywhere}#dots span{display:block}</style></head><body><header><h1>궁금점 PLAY 간편 모드</h1></header><main><h2 id="heading"></h2><div id="question"></div><form id="form"><label for="answer">정답 입력</label><p><input id="answer" type="text" autocomplete="off"></p><button type="submit">정답 확인</button></form><p id="feedback" role="status" aria-live="polite"></p><button type="button" id="show">정답 보기</button><button type="button" id="next">다음 문제</button><a class="back" href="simple.html">학습 메뉴로 돌아가기</a></main><footer><p>전남점자도서관 시각장애인학습지원센터</p></footer><script>
(function(){
var mode="숫자",list=[{"prompt": "0", "braille": "⠼⠚", "rule": "제40항 숫자"}, {"prompt": "1", "braille": "⠼⠁", "rule": "제40항 숫자"}, {"prompt": "2", "braille": "⠼⠃", "rule": "제40항 숫자"}, {"prompt": "3", "braille": "⠼⠉", "rule": "제40항 숫자"}, {"prompt": "4", "braille": "⠼⠙", "rule": "제40항 숫자"}, {"prompt": "5", "braille": "⠼⠑", "rule": "제40항 숫자"}, {"prompt": "6", "braille": "⠼⠋", "rule": "제40항 숫자"}, {"prompt": "7", "braille": "⠼⠛", "rule": "제40항 숫자"}, {"prompt": "8", "braille": "⠼⠓", "rule": "제40항 숫자"}, {"prompt": "9", "braille": "⠼⠊", "rule": "제40항 숫자"}, {"prompt": "10", "braille": "⠼⠁⠚", "rule": "제40항 숫자"}, {"prompt": "11", "braille": "⠼⠁⠁", "rule": "제40항 숫자"}, {"prompt": "12", "braille": "⠼⠁⠃", "rule": "제40항 숫자"}, {"prompt": "13", "braille": "⠼⠁⠉", "rule": "제40항 숫자"}, {"prompt": "14", "braille": "⠼⠁⠙", "rule": "제40항 숫자"}, {"prompt": "15", "braille": "⠼⠁⠑", "rule": "제40항 숫자"}, {"prompt": "16", "braille": "⠼⠁⠋", "rule": "제40항 숫자"}, {"prompt": "17", "braille": "⠼⠁⠛", "rule": "제40항 숫자"}, {"prompt": "18", "braille": "⠼⠁⠓", "rule": "제40항 숫자"}, {"prompt": "19", "braille": "⠼⠁⠊", "rule": "제40항 숫자"}, {"prompt": "20", "braille": "⠼⠃⠚", "rule": "제40항 숫자"}, {"prompt": "21", "braille": "⠼⠃⠁", "rule": "제40항 숫자"}, {"prompt": "22", "braille": "⠼⠃⠃", "rule": "제40항 숫자"}, {"prompt": "23", "braille": "⠼⠃⠉", "rule": "제40항 숫자"}, {"prompt": "24", "braille": "⠼⠃⠙", "rule": "제40항 숫자"}, {"prompt": "25", "braille": "⠼⠃⠑", "rule": "제40항 숫자"}, {"prompt": "26", "braille": "⠼⠃⠋", "rule": "제40항 숫자"}, {"prompt": "27", "braille": "⠼⠃⠛", "rule": "제40항 숫자"}, {"prompt": "28", "braille": "⠼⠃⠓", "rule": "제40항 숫자"}, {"prompt": "29", "braille": "⠼⠃⠊", "rule": "제40항 숫자"}, {"prompt": "30", "braille": "⠼⠉⠚", "rule": "제40항 숫자"}, {"prompt": "42", "braille": "⠼⠙⠃", "rule": "제40항 숫자"}, {"prompt": "57", "braille": "⠼⠑⠛", "rule": "제40항 숫자"}, {"prompt": "64", "braille": "⠼⠋⠙", "rule": "제40항 숫자"}, {"prompt": "75", "braille": "⠼⠛⠑", "rule": "제40항 숫자"}, {"prompt": "81", "braille": "⠼⠓⠁", "rule": "제40항 숫자"}, {"prompt": "93", "braille": "⠼⠊⠉", "rule": "제40항 숫자"}, {"prompt": "99", "braille": "⠼⠊⠊", "rule": "제40항 숫자"}, {"prompt": "100", "braille": "⠼⠁⠚⠚", "rule": "제40항 숫자"}, {"prompt": "105", "braille": "⠼⠁⠚⠑", "rule": "제40항 숫자"}, {"prompt": "120", "braille": "⠼⠁⠃⠚", "rule": "제40항 숫자"}, {"prompt": "128", "braille": "⠼⠁⠃⠓", "rule": "제40항 숫자"}, {"prompt": "150", "braille": "⠼⠁⠑⠚", "rule": "제40항 숫자"}, {"prompt": "200", "braille": "⠼⠃⠚⠚", "rule": "제40항 숫자"}, {"prompt": "256", "braille": "⠼⠃⠑⠋", "rule": "제40항 숫자"}, {"prompt": "300", "braille": "⠼⠉⠚⠚", "rule": "제40항 숫자"}, {"prompt": "375", "braille": "⠼⠉⠛⠑", "rule": "제40항 숫자"}, {"prompt": "420", "braille": "⠼⠙⠃⠚", "rule": "제40항 숫자"}, {"prompt": "480", "braille": "⠼⠙⠓⠚", "rule": "제40항 숫자"}, {"prompt": "512", "braille": "⠼⠑⠁⠃", "rule": "제40항 숫자"}, {"prompt": "700", "braille": "⠼⠛⠚⠚", "rule": "제40항 숫자"}, {"prompt": "999", "braille": "⠼⠊⠊⠊", "rule": "제40항 숫자"}],order=[],at=0,item=null,timer=null;
function e(id){return document.getElementById(id)}
function add(tag,content,parent){var n=document.createElement(tag);n.appendChild(document.createTextNode(content));parent.appendChild(n);return n}
function shuffle(){order=[];for(var i=0;i<list.length;i++)order.push(i);for(var j=order.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=order[j];order[j]=order[k];order[k]=t}at=0}
function cancel(){if(timer){clearTimeout(timer);timer=null}}
function next(){cancel();if(at>=order.length)shuffle();item=list[order[at++]];e('question').innerHTML='';e('feedback').innerHTML='';e('answer').value='';
var cat=mode==='random'?item._category:mode;
if(cat==='점자 읽기'){add('p','다음 점자를 읽고 정답을 입력하세요.',e('question'));var d=add('div','',e('question'));d.id='dots';var lines=item.readingLines||[item.braille];for(var i=0;i<lines.length;i++)add('span',lines[i],d)}
else if(cat==='맞춤법'){add('p','올바른 표기를 입력하세요.',e('question'));add('p',item.prompt,e('question'));if(item.cue)add('p',item.cue,e('question'))}
else{add('p','다음 항목에 해당하는 점자를 입력하세요.',e('question'));add('p',item.prompt,e('question'))}
e('answer').focus()}
function expected(){var cat=mode==='random'?item._category:mode;return cat==='점자 읽기'||cat==='맞춤법'?item.answer:item.braille}
function norm(s){return String(s||'').replace(/\s/g,'').replace(/[.,!?。，！？]/g,'')}
e('heading').appendChild(document.createTextNode("숫자 연습"));
e('form').onsubmit=function(ev){if(ev&&ev.preventDefault)ev.preventDefault();cancel();if(norm(e('answer').value)===norm(expected())&&norm(expected())!==''){e('feedback').innerHTML='정답입니다. 다음 문제로 이동합니다.';timer=setTimeout(next,2500)}else{e('feedback').innerHTML='오답입니다. 다시 입력해 보세요.';e('answer').focus()}return false};
e('show').onclick=function(){cancel();e('feedback').innerHTML='';add('span','정답: '+expected(),e('feedback'))};
e('next').onclick=next;
shuffle();next();
})();
</script></body></html>
