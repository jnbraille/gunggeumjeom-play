function expected(){var cat=mode==='random'?item._category:mode;return cat==='점자 읽기'||cat==='맞춤법'?item.answer:item.braille}

e('heading').appendChild(document.createTextNode("점자 랜덤 연습"));
e('form').onsubmit=function(ev){if(ev&&ev.preventDefault)ev.preventDefault();cancel();if(norm(e('answer').value)===norm(expected())&&norm(expected())!==''){e('feedback').innerHTML='정답입니다. 다음 문제로 이동합니다.';timer=setTimeout(next,2500)}else{e('feedback').innerHTML='오답입니다. 다시 입력해 보세요.';e('answer').focus()}return false};
