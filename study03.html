<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모음 연습 - 궁금점 PLAY</title><style>body{font-family:Arial,"Malgun Gothic",sans-serif;font-size:19px;line-height:1.6;max-width:720px;margin:0 auto;padding:16px;color:#111;background:#fff}a,button,input{font-size:inherit}nav a,.back,button{display:block;padding:12px;margin:9px 0;border:2px solid #333;color:#111;background:#fff;text-decoration:none}input{padding:12px;max-width:90%;border:2px solid #333}a:focus,button:focus,input:focus{outline:3px solid #0060aa}#feedback{font-weight:bold}#dots{font-size:28px;white-space:pre-wrap;overflow-wrap:anywhere}#dots span{display:block}</style></head><body><header><h1>궁금점 PLAY 간편 모드</h1></header><main><h2 id="heading"></h2><div id="question"></div><form id="form"><label for="answer">정답 입력</label><p><input id="answer" type="text" autocomplete="off"></p><button type="submit">정답 확인</button></form><p id="feedback" role="status" aria-live="polite"></p><button type="button" id="show">정답 보기</button><button type="button" id="next">다음 문제</button><a class="back" href="simple.html">학습 메뉴로 돌아가기</a></main><footer><p>전남점자도서관 시각장애인학습지원센터</p></footer><script>
(function(){
var mode="모음",list=[{"prompt": "ㅏ", "braille": "⠣", "rule": "제6항 기본 모음자"}, {"prompt": "ㅑ", "braille": "⠜", "rule": "제6항 기본 모음자"}, {"prompt": "ㅓ", "braille": "⠎", "rule": "제6항 기본 모음자"}, {"prompt": "ㅕ", "braille": "⠱", "rule": "제6항 기본 모음자"}, {"prompt": "ㅗ", "braille": "⠥", "rule": "제6항 기본 모음자"}, {"prompt": "ㅛ", "braille": "⠬", "rule": "제6항 기본 모음자"}, {"prompt": "ㅜ", "braille": "⠍", "rule": "제6항 기본 모음자"}, {"prompt": "ㅠ", "braille": "⠩", "rule": "제6항 기본 모음자"}, {"prompt": "ㅡ", "braille": "⠪", "rule": "제6항 기본 모음자"}, {"prompt": "ㅣ", "braille": "⠕", "rule": "제6항 기본 모음자"}, {"prompt": "ㅐ", "braille": "⠗", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅒ", "braille": "⠜⠗", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅔ", "braille": "⠝", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅖ", "braille": "⠌", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅘ", "braille": "⠧", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅙ", "braille": "⠧⠗", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅚ", "braille": "⠽", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅝ", "braille": "⠏", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅞ", "braille": "⠏⠗", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅟ", "braille": "⠍⠗", "rule": "제7항 그 밖의 모음자"}, {"prompt": "ㅢ", "braille": "⠺", "rule": "제7항 그 밖의 모음자"}],order=[],at=0,item=null,timer=null;
function e(id){return document.getElementById(id)}
function add(tag,content,parent){var n=document.createElement(tag);n.appendChild(document.createTextNode(content));parent.appendChild(n);return n}
function shuffle(){order=[];for(var i=0;i<list.length;i++)order.push(i);for(var j=order.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=order[j];order[j]=order[k];order[k]=t}at=0}
function cancel(){if(timer){clearTimeout(timer);timer=null}}
function next(){cancel();if(at>=order.length)shuffle();item=list[order[at++]];e('question').innerHTML='';e('feedback').innerHTML='';e('answer').value='';
var cat=mode==='random'?item._category:mode;
if(cat==='점자 읽기'){add('p','다음 점자를 읽고 정답을 입력하세요.',e('question'));var d=add('div','',e('question'));d.id='dots';var lines=item.readingLines||[item.braille];for(var i=0;i<lines.length;i++)add('span',lines[i],d)}
else if(cat==='맞춤법'){add('p','올바른 표기를 입력하세요.',e('question'));add('p',item.prompt,e('question'));if(item.cue)add('p',item.cue,e('question'))}
else{add('p','다음 항목에 해당하는 점자를 입력하세요.',e('question'));add('p',item.prompt,e('question'))}
e('answer').focus()}
function expected(){var cat=mode==='random'?item._category:mode;return cat==='점자 읽기'||cat==='맞춤법'?item.answer:item.braille}
function norm(s){return String(s||'').replace(/\s/g,'').replace(/[.,!?。，！？]/g,'')}
e('heading').appendChild(document.createTextNode("모음 연습"));
e('form').onsubmit=function(ev){if(ev&&ev.preventDefault)ev.preventDefault();cancel();if(norm(e('answer').value)===norm(expected())&&norm(expected())!==''){e('feedback').innerHTML='정답입니다. 다음 문제로 이동합니다.';timer=setTimeout(next,2500)}else{e('feedback').innerHTML='오답입니다. 다시 입력해 보세요.';e('answer').focus()}return false};
e('show').onclick=function(){cancel();e('feedback').innerHTML='';add('span','정답: '+expected(),e('feedback'))};
e('next').onclick=next;
shuffle();next();
})();
</script></body></html>
