<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한소네 입력 테스트 - 궁금점 PLAY</title></head>
<body>
<h1>한소네 입력 테스트</h1>
<p>이 페이지는 입력창과 제출 기능만 확인합니다. 기존 사이트는 변경하지 않습니다.</p>
<h2>시험 1. 기본 한 줄 입력</h2>
<form action="" method="get">
<label for="answer">정답 입력</label>
<input id="answer" name="answer" type="text" size="20">
<input type="submit" value="입력 결과 확인">
</form>
<h2>시험 2. 여러 줄 입력</h2>
<form action="" method="get">
<label for="longanswer">두 번째 입력창</label>
<textarea id="longanswer" name="longanswer" rows="3" cols="25"></textarea>
<input type="submit" value="두 번째 입력 결과 확인">
</form>
<h2>시험 3. 링크 이동</h2>
<p><a href="#end">아래 확인 위치로 이동</a></p>
<h2 id="end">확인 위치</h2>
<p>입력에 성공했다면 주소에 answer 또는 longanswer 값이 표시됩니다.</p>
<p><a href="simple.html">간편 모드 메뉴로 돌아가기</a></p>
</body></html>
