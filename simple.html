,{"prompt":"된소리 글자 ‘ㄲ, ㄸ, ㅃ, ㅆ, ㅉ’이 첫소리로 쓰일 때에는 ‘ㄱ, ㄷ, ㅂ, ㅅ, ㅈ’ 앞에 된소리표를 적어 나타낸다.","braille":"","rule":"제2항"},{"prompt":"기본 자음자 14개가 받침으로 쓰일 때에는 다음과 같이 적는다.","braille":"","rule":"제3항"},{"prompt":"쌍받침 ‘ㄲ’은 각각의 받침 ㄱ을 이어 적고, 쌍받침 ‘ㅆ’은 약자를 사용하여 적는다.","braille":"","rule":"제4항"},{"prompt":"겹받침은 각 받침 글자를 어울러 적는다.","braille":"","rule":"제5항"},{"prompt":"기본 모음자 10개는 정해진 점형으로 적는다.","braille":"","rule":"제6항"},{"prompt":"그 밖의 모음자 11개는 정해진 점형으로 적는다.","braille":"","rule":"제7항"},{"prompt":"자음자나 모음자가 단독으로 쓰일 때에는 해당 글자 앞에 온표를 적어 나타내며, 자음자는 받침으로 적는다.","braille":"","rule":"제8항"},{"prompt":"한글의 자음자가 번호로 쓰일 때에는 온표를 앞세워 받침으로 적는다.","braille":"","rule":"제9항"},{"prompt":"단독으로 쓰인 자음자가 단어에 붙어 나올 때에는 별도의 표를 앞세워 받침으로 적는다.","braille":"","rule":"제10항"},{"prompt":"모음자에 ‘예’가 붙어 나올 때에는 그 사이에 구분표를 적어 나타낸다.","braille":"","rule":"제11항"},{"prompt":"‘ㅑ, ㅘ, ㅜ, ㅝ’에 ‘애’가 붙어 나올 때에는 두 모음자 사이에 구분표를 적어 나타낸다.","braille":"","rule":"제12항"},{"prompt":"규정에서 정한 글자들은 약자를 사용하여 적는다.","braille":"","rule":"제13항"},{"prompt":"‘나, 다, 마, 바, 자, 카, 타, 파, 하’에 모음이 붙어 나올 때에는 약자를 사용하지 않는다.","braille":"","rule":"제14항"},{"prompt":"‘억, 언, 얼, 연, 열, 영, 옥, 온, 옹, 운, 울, 은, 을, 인, 것’ 등 규정에서 정한 글자들은 약자를 사용하여 적는다.","braille":"","rule":"제15항"},{"prompt":"‘까, 싸, 껏’을 적을 때에는 ‘가, 사, 것’의 약자 앞에 된소리표를 적어 나타낸다.","braille":"","rule":"제16항"},{"prompt":"‘성, 썽, 정, 쩡, 청’을 적을 때에는 해당 첫소리 다음에 ‘영’의 약자를 적어 나타낸다.","braille":"","rule":"제17항"},{"prompt":"규정에서 정한 단어들은 약어를 사용하여 적는다.","braille":"","rule":"제18항"},{"prompt":"자음자 가운데 옛 글자는 옛 글자표를 앞세워 적는다.","braille":"","rule":"제19항"},{"prompt":"연서로 만들어진 옛 자음자는 옛 글자표를 앞세워 적는다.","braille":"","rule":"제20항"},{"prompt":"각자 병서로 만들어진 옛 자음자는 옛 글자표를 앞세워 적는다.","braille":"","rule":"제21항"},{"prompt":"합용 병서로 만들어진 옛 자음자가 첫소리로 쓰일 때에는 옛 글자표를 앞세워 각 자음자를 어울러 적는다.","braille":"","rule":"제22항"},{"prompt":"단독으로 쓰인 자음자가 단어의 중간이나 끝에 붙어 나올 때에는 별도의 표를 앞세워 받침으로 적는다.","braille":"","rule":"제23항"},{"prompt":"옛 자음자가 포함된 글자에 모음 ‘ㅏ’가 나올 때에는 ‘ㅏ’를 생략하지 않는다.","braille":"","rule":"제24항"},{"prompt":"옛 모음자는 규정에서 정한 점형으로 적는다.","braille":"","rule":"제25항"},{"promp ⠠⠨⠷⠊⠪⠈⠕ ⠣⠙⠥⠂⠐⠥ ⠊⠪⠶ ⠰⠍⠹⠺ ⠫⠒⠠⠕⠁","answer":"쫀드기 아폴로 등 추억의 간식","braille":"⠠⠨⠷⠊⠪⠈⠕ ⠣⠙⠥⠂⠐⠥ ⠊⠪⠶ ⠰⠍⠹⠺ ⠫⠒⠠⠕⠁","rule":"","readingLines":["⠠⠨⠷⠊⠪⠈⠕ ⠣⠙⠥⠂⠐⠥ ⠊⠪⠶"," ⠰⠍⠹⠺ ⠫⠒⠠⠕⠁"]}]};</script><script>var STORY=[{"title": "1. 점자는 6개의 점으로 시작합니다", "text": "1 4 2 5 3 6 한국 점자는 한 칸을 세로 3점 × 가로 2점 으로 구성합니다. 왼쪽 위에서 아래로 1·2·3점 , 오른쪽 위에서 아래로 4·5·6점 이라고 부릅니다. 2024 한국 점자 규정은 이 여섯 점을 조합해 63가지 점형 을 만든다고 정하고 있습니다. 아무 점도 찍지 않은 빈칸은 점형에 포함하지 않습니다."}, {"title": "2. 12점식에서 6점식 점자로", "text": "오늘날 널리 사용하는 6점식 점자가 처음부터 있었던 것은 아닙니다. 프랑스 통신 부대 장교였던 샤를 바르비에 는 어두운 전쟁터에서도 손끝으로 내용을 확인할 수 있도록 12점형 야간 문자 를 고안했습니다. 다만 이 체계는 일반적인 문자로 자리 잡은 점자는 아니었습니다. 루이 브라유(1809~1852) 는 이를 바탕으로 더 간결한 6점식 점자 를 개발했고, 1829년에 자신의 점자 체계를 발표했습니다. 브라유의 6점식 체계는 이후 널리 보급되어 오늘날 여러 나라에서 사용하는 점자 체계의 기반이 되었습니다. 12점식 바르비에의 야간 문자 6점식 루이 브라유가 발전시킨 점자 체계"}, {"title": "3. 한글 점자도 여러 시도를 거쳐 발전했습니다", "text": "로제타 홀(Rossetta Sherwood Hall) 은 뉴욕 포인트 점자(4점)를 변형해 한글을 나타내는 4점식 평양 점자 를 만들었습니다. 우리나라에서는 1894년부터 맹인 교육에서 이 점자가 사용되기 시작했습니다. 이후 제생원 맹아부 교사였던 송암 박두성 은 한글에 더 알맞은 점자 체계를 연구했습니다. 1920년부터 한글 점자를 연구하기 시작했고, 1923년 제자들과 조선어점자연구위원회 를 조직해 연구를 이어 갔으며, 1926년 11월 4일 ‘훈맹정음’ 이라는 이름으로 6점식 한글 점자를 반포했습니다. 4점식 로제타 홀의 평양 점자 6점식 박두성의 훈맹정음 11월 4일은 훈맹정음 반포를 기념하는 한글 점자의 날입니다."}, {"title": "4. 점자를 찍고 인쇄하는 기술도 발전했습니다", "text": "점자를 기록하고 대량으로 제작하는 방법도 손으로 한 점씩 찍는 방식에서 점자 타자기, 제판·인쇄 장비, 전자식 점자 프린터 등으로 발전해 왔습니다. 오늘날에는 점역 프로그램으로 문자를 점자로 변환하고, 점자 프린터로 점자 종이에 출력하며, 점자정보단말기를 이용해 디지털 점자를 읽고 입력할 수 있습니다."}, {"title": "5. 한글 점자는 글자를 풀어 씁니다", "text": "묵자는 자음과 모음을 한 글자 안에 모아 쓰지만, 한국 점자는 기본적으로 풀어쓰기 방식 을 사용합니다. 한 음절을 첫소리(초성), 모음, 받침(종성)의 순서로 이어 적습니다. 한 → ㅎ(첫소리) + ㅏ(모음) + ㄴ(받침) 첫소리 ‘ㅇ’은 일반적으로 점자로 적지 않는다는 점도 한글 점자의 중요한 특징입니다."}, {"title": "6. 자음은 어떻게 구성될까요?", "text": "2024 개정 규정의 기본 자음자는 14개 입니다. ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㅇ ㅈ ㅊ ㅋ ㅌ ㅍ ㅎ 된소리 ㄲ·ㄸ·ㅃ·ㅆ·ㅉ 은 별도의 된소리표와 기본 자음을 어울러 나타냅니다. 따라서 현대 한글의 자음 19자를 점자에서는 기본 자음과 된소리 규칙으로 표현합니다. 받침도 기본 자음자 14개를 바탕으로 하며, 쌍받침과 겹받침은 규정에 따라 어울러 적습니다."}, {"title": "7. 모음은 모두 21개입니다", "text": "규정에서는 기본 모음자 10개 와 그 밖의 모음자 11개 를 제시하여 모두 21개의 현대 한글 모음을 나타냅니다. 기본 모음 10개 ㅏ ㅑ ㅓ ㅕ ㅗ ㅛ ㅜ ㅠ ㅡ ㅣ 그 밖의 모음 11개 ㅐ ㅒ ㅔ ㅖ ㅘ ㅙ ㅚ ㅝ ㅞ ㅟ ㅢ"}, {"title": "8. 약자는 왜 사용할까요?", "text": "점자는 손끝으로 한 칸씩 읽기 때문에 자주 쓰이는 글자를 더 짧게 나타내는 약자 가 있습니다. 2024 규정의 기본 약자는 크게 두 묶음으로 볼 수 있습니다. 11개 가·나·다·마·바·사·자·카·타·파·하 15개 억·언·얼·연·열·영·옥·온·옹·운·울·은·을·인·것 따라서 위 두 표에 직접 제시된 기본 약자 항목은 26개 입니다. 여기에 받침이나 된소리가 결합되는 경우, ‘성·썽·정·쩡·청’처럼 약자를 활용하는 추가 규칙도 있습니다."}, {"title": "9. 약어는 7개입니다", "text": "약어 는 자주 쓰이는 단어 전체를 짧게 적는 방식입니다. 2024 규정 제18항에는 다음 7개가 제시되어 있습니다. 그래서 그러나 그러면 그러므로 그런데 그리고 그리하여 약자와 약어는 단순히 외워서 줄이는 것이 아니라, 규정에서 정한 조건에 따라 사용합니다."}, {"title": "10. 숫자는 수표와 함께 읽습니다", "text": "점자는 한정된 6점 조합을 여러 목적으로 사용하기 때문에, 같은 점형이 문맥에 따라 다른 의미를 가질 수 있습니다. 숫자를 적을 때에는 수표 를 먼저 적어 뒤의 점형이 숫자임을 알려 줍니다. 핵심 점형만 보는 것이 아니라 앞뒤의 기호와 문맥까지 함께 읽어야 정확합니다."}, {"title": "11. 점자의 장점", "text": "의사소통 시각장애인의 중요한 의사소통 수단이며, 맹농인에게도 실질적인 의사소통 수단이 될 수 있습니다. 읽기 필요한 부분을 자세히 읽거나 다시 확인하는 등 정독과 재확인이 가능합니다. 문해력 올바른 맞춤법과 철자를 익히는 데 도움이 됩니다. 활용 점자를 익히면 학습과 일상생활의 다양한 정보에 직접 접근할 수 있습니다."}, {"title": "12. 점자의 단점", "text": "읽기 속도 묵독이나 청독에 비해 읽는 속도가 느릴 수 있습니다. 자료 접근 점자도서나 점자 간행물을 구하기 어려운 경우가 있습니다. 제작·보관 점자도서는 제작 비용이 높고 부피가 커 휴대와 보관에 어려움이 있을 수 있습니다. 약자 학습 약자를 사용하므로 올바른 철자법을 익힐 때 세심한 주의가 필요합니다."}, {"title": "13. 점자는 디지털 환경에서도 활용됩니다", "text": "점자는 종이에 인쇄해서 읽는 것뿐 아니라 컴퓨터와 휴대용 정보기기에서도 사용할 수 있습니다. 점자 자료를 만들고 읽고 출력하는 과정에는 여러 기기와 소프트웨어가 함께 활용됩니다. 점역 프로그램 일반 문자를 점자로 변환하거나 점자 문서를 작성하는 데 사용하는 프로그램입니다. 점사랑, 실로암브레일, 덕스베리(Duxbury), 하상브레일 등이 있습니다. 점자정보단말기 점자 입·출력을 지원하는 휴대용 정보기기입니다. 점자로 문서를 읽고 작성하거나 다양한 디지털 정보를 이용할 수 있으며, 한소네와 브레일노트 등이 대표적인 예입니다. 점자 프린터 점역된 전자 자료를 종이에 촉각으로 읽을 수 있는 점자로 출력하는 장치입니다. 브레일로(Braillo), 베이직(Basic), 에베레스트(Everest) 등의 제품이 있습니다. 스크린 리더 컴퓨터 화면의 글자와 정보를 음성 등으로 확인할 수 있도록 돕는 화면 낭독 프로그램입니다. 센스리더, JAWS, 보이스위드 등이 활용됩니다."}, {"title": "14. 한글 점자를 지키는 제도도 있습니다", "text": "한글 점자는 오랜 연구와 표준화 과정을 거쳐 오늘날의 체계를 갖추었습니다. 「한국 점자 규정」은 1997년 12월 17일 처음 고시 되었고, 이후 2006년·2017년 전면 개정, 2020년 일부 개정을 거쳐 2024년 다시 개정되었습니다. 제4조 점자는 일반 활자와 동일한 효력을 갖는 문자로 규정됩니다. 제7조 문화체육관광부장관이 5년마다 점자발전기본계획을 수립하도록 정하고 있습니다. 제15조 매년 11월 4일을 한글 점자의 날로 정하고, 그 날이 포함된 주간을 한글 점자 주간으로 정하는 내용이 마련되었습니다. 제18조 점자 관련 전문인력의 자격 종류·요건과 자격 부여 방법 등에 필요한 사항을 대통령령으로 정하도록 하고 있습니다. 점자법은 2016년 5월 29일 제정 되어 2017년 5월 30일 시행 되었고, 한글 점자의 날과 관련된 내용은 2020년 12월 일부 개정을 거쳤습니다. 점자는 단순한 기호 체계를 넘어 시각장애인이 문자 정보를 읽고 쓰며 학습하고 소통하는 데 사용되는 문자입니다."}, {"title": "참고 자료", "text": "문화체육관광부고시 제2024-0005호 「2024 개정 한국 점자 규정」 · 국립국어원 점자 자료 · 「점자법」"}];</script><script>
(function(){'use strict';var keys=['초성','종성','모음','약자·약어','로마자','숫자','문장부호','단어','문장','점자 읽기','맞춤법'],mode='',order=[],at=0,item=null,timeout=null,randomItems=[];
function el(id){return document.getElementById(id)}function node(tag,txt){var n=document.createElement(tag);n.textContent=txt;return n}
function mix(len){var a=[],i,j,t;for(i=0;i<len;i++)a.push(i);for(i=len-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
var storyLink=node('a','점자 상식');storyLink.href='#story';el('menus').appendChild(storyLink);keys.forEach(function(k){var a=node('a',k+' 연습');a.href='#'+encodeURIComponent(k);el('menus').appendChild(a)});var randomLink=node('a','점자 랜덤 연습');randomLink.href='#random';el('menus').appendChild(randomLink);
function stop(){if(timeout!==null){clearTimeout(timeout);timeout=null}}
function next(){stop();var a=mode==='random'?randomItems:DATA[mode];if(at>=order.length){order=mix(a.length);at=0}item=a[order[at++]];var activeMode=mode==='random'?item._category:mode;el('question').textContent='';el('feedback').textContent='';el('answer').value='';
if(activeMode==='점자 읽기'){el('question').appendChild(node('p','다음 점자를 읽고 정답을 입력하세요.'));var b=node('div','');b.id='dots';(item.readingLines||[item.braille]).forEach(function(line){b.appendChild(node('span',line))});el('question').appendChild(b)}
else if(activeMode==='맞춤법'){el('question').appendChild(node('p','올바른 표기를 입력하세요.'));el('question').appendChild(node('p',item.prompt));if(item.cue)el('question').appendChild(node('p',item.cue))}
else if(activeMode==='한글 점자 규정'){el('question').appendChild(node('p',item.prompt));if(item.rule)el('question').appendChild(node('p',item.rule))}
else{el('question').appendChild(node('p','다음 항목에 해당하는 점자를 입력하세요.'));el('question').appendChild(node('p',item.prompt));}
el('answer').focus()}
function expected(){var m=mode==='random'?item._category:mode;return m==='점자 읽기'||m==='맞춤법'?item.answer:item.braille}
function norm(s){return String(s||'').normalize('NFC').replace(/\s/g,'').replace(/[.,!?。，！？]/g,'')}
el('form').onsubmit=function(e){e.preventDefault();if(!item)return;stop();if(norm(el('answer').value)===norm(expected())&&norm(expected())!==''){el('feedback').textContent='정답입니다. 다음 문제로 이동합니다.';timeout=setTimeout(function(){timeout=null;next()},1800)}else{el('feedback').textContent='오답입니다. 다시 입력해 보세요.';el('answer').focus()}};
el('show').onclick=function(){stop();if(item)el('feedback').textContent='정답: '+expected()};el('next').onclick=next;
function route(){stop();var k;try{k=decodeURIComponent(location.hash.slice(1))}catch(e){k='home'}if(k==='story'){mode='';el('home').hidden=true;el('study').hidden=true;el('story').hidden=false;el('storyHeading').focus();return;}el('story').hidden=true;if((keys.indexOf(k)>=0&&DATA[k].length)||k==='random'){mode=k;if(k==='random'){randomItems=[];keys.forEach(function(cat){if(cat==='맞춤법')return;(DATA[cat]||[]).forEach(function(v){var copy=Object.assign({_category:cat},v);randomItems.push(copy)})})}order=mix(k==='random'?randomItems.length:DATA[k].length);at=0;el('home').hidden=true;el('study').hidden=false;el('heading').textContent=k==='random'?'점자 랜덤 연습':k+' 연습';next();el('heading').focus()}else{mode='';el('study').hidden=true;el('home').hidden=false}}
STORY.forEach(function(entry,i){var article=document.createElement('article');article.id='story-item-'+i;var h=node('h3',entry.title);h.tabIndex=-1;article.appendChild(h);article.appendChild(node('p',entry.text));el('storyContent').appendChild(article)});window.addEventListener('hashchange',function(){if(location.hash.indexOf('#story-item-')===0){var target=document.getElementById(location.hash.slice(1));if(target){el('home').hidden=true;el('study').hidden=true;el('story').hidden=false;target.querySelector('h3').focus();}return;}route()});route();})();</script></body></html>
